name: Release

on:
  push:
    tags:
      - 'release/*'

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install ARM tools
      run: make arm_sdk_install

    - name: Set build variables
      run: |
        GIT_VER=${GITHUB_REF##*/}
        GIT_TAG=${GITHUB_REF##refs/tags/}
        if [[ ${GIT_VER} =~ ^[0-9]+[.][0-9]+[.][0-9]+[-][A-Za-z0-9]+ ]]
        then
          GIT_PRE="${GIT_VER##*-}"
          GH_TYPE='Release Candidate'
        else
          GIT_PRE=''
          GH_TYPE='Release'
        fi
        echo "GIT_VER=${GIT_VER}" >> ${GITHUB_ENV}
        echo "GIT_TAG=${GIT_TAG}" >> ${GITHUB_ENV}
        echo "GIT_PRE=${GIT_PRE}" >> ${GITHUB_ENV}
        echo "GH_TYPE=${GH_TYPE}" >> ${GITHUB_ENV}
        cat ${GITHUB_ENV}

    - name: Build HEX files for unified targets
      run: make unified FC_VER_SUFFIX="${{ env.GIT_PRE }}" FLASH_CONFIG_ERASE=yes

    - name: Create Release
      run: |
        .github/scripts/extract-release-notes.py "${{ env.GIT_VER }}" Releases.md > Notes.md
        # Re-runnable: a rerun after a later step failed finds the release already
        # there and just replaces its files.
        if gh release view ${{ env.GIT_TAG }} > /dev/null 2>&1; then
          gh release upload ${{ env.GIT_TAG }} obj/*.hex --clobber
        else
          gh release create ${{ env.GIT_TAG }} --notes-file Notes.md --title "Gripora ${{ env.GH_TYPE }} ${{ env.GIT_VER }}" obj/*.hex
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate gripora-artifacts App token
      id: artifacts-app-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ secrets.ARTIFACTS_APP_ID }}
        private-key: ${{ secrets.ARTIFACTS_APP_PRIVATE_KEY }}
        owner: gripora-project
        repositories: gripora-artifacts

    - name: Publish firmware for browser downloads
      env:
        ARTIFACTS_REPO_TOKEN: ${{ steps.artifacts-app-token.outputs.token }}
      run: |
        git clone --depth 1 "https://x-access-token:${ARTIFACTS_REPO_TOKEN}@github.com/gripora-project/gripora-artifacts.git" artifacts-repo
        mkdir -p "artifacts-repo/firmware/${{ env.GIT_TAG }}"
        cp obj/*.hex "artifacts-repo/firmware/${{ env.GIT_TAG }}/"
        cd artifacts-repo
        git config user.name "gripora-artifacts[bot]"
        git config user.email "gripora-artifacts[bot]@users.noreply.github.com"
        git add "firmware/${{ env.GIT_TAG }}"
        # Nothing to commit when a rerun publishes the same files again
        if git diff --cached --quiet; then
          echo "firmware/${{ env.GIT_TAG }} is already published"
        else
          git commit -m "firmware: ${{ env.GIT_TAG }}"
          git push origin master
        fi
